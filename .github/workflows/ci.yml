name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify PaceKit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :pacekit:test

      - name: Check binary compatibility
        run: ./gradlew :pacekit:checkLegacyAbi

      - name: Generate documentation
        run: ./gradlew :pacekit:dokkaGenerate

      - name: Build library
        run: ./gradlew :pacekit:jar :pacekit:sourcesJar :pacekit:dokkaJavadocJar